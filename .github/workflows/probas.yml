name: Probas do núcleo

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  probas:
    name: ${{ matrix.nome }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: Mac, os: macos-15, xerador: Xcode, exe: "" }
          - { nome: Windows, os: windows-latest, xerador: "", exe: ".exe" }   # o Visual Studio que haxa
          - { nome: Linux, os: ubuntu-22.04, xerador: Ninja, exe: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libfreetype6-dev libfontconfig1-dev ninja-build
      - name: JUCE
        run: git clone -q --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git "$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/JUCE"
      - name: Compilar
        run: |
          T="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          if [ -n "${{ matrix.xerador }}" ]; then G=(-G "${{ matrix.xerador }}"); else G=(-A x64); fi
          cmake -S probas -B build "${G[@]}" -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$T/JUCE"
          cmake --build build --config Release
      - name: Probas
        run: ./build/ProbaNucleo_artefacts/Release/ProbaNucleo${{ matrix.exe }}
      - name: Aviso das versións, de verdade (Linux, co curl do sistema)
        if: runner.os == 'Linux'
        continue-on-error: true   # (depende da rede e do límite da API de GitHub)
        run: ./build/ProbaNucleoRede_artefacts/Release/ProbaNucleoRede --rede
      - name: Empaquetado (sintaxe)
        run: bash -n empaquetado/mac.sh && bash -n empaquetado/linux.sh
