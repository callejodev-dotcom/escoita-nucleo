name: Plugin de Escoita

# A CI común dos plugins: compila en Mac (universal), Windows e Linux, pasa as probas do
# plugin, pluginval, auval e clap-validator, empaqueta e, ao subir unha etiqueta «v…»,
# publica a versión cos instaladores. Cada plugin chámaa así (.github/workflows/build.yml):
#
#   on: { push: { branches: ["**"], tags: ["v*"] }, workflow_dispatch: }
#   jobs:
#     plugin:
#       uses: callejodev-dotcom/escoita-nucleo/.github/workflows/plugin.yml@v0.1.0
#       secrets: inherit
#       permissions:
#         contents: write   # para publicar a versión
#
# O plugin pon: packaging/produto.env (os datos do produto), packaging/LEEME-mac.txt,
# packaging/LEEME-windows.txt, packaging/NOTAS-VERSION.md e, se ten probas, tools/probas-ci.sh
# (chámase con mac, windows, linux ou sanitizadores desde a raíz, coa compilación en build/).
# A versión do núcleo é a que fixe o CMakeLists.txt (ESCOITA_NUCLEO_VERSION).

on:
  workflow_call:
    inputs:
      juce:
        description: "Versión de JUCE"
        type: string
        default: "8.0.4"
      sanitizadores:
        description: "Destinos de proba para compilar con ASan e UBSan (baleiro: non hai)"
        type: string
        default: ""

jobs:
  mac:
    name: Mac (Apple Silicon + Intel)
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_DEV_ID: ${{ secrets.MACOS_DEV_ID }}
      MACOS_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Datos do produto, JUCE e núcleo
        run: |
          source packaging/produto.env
          VER=$(grep -oE "project\($CURTO VERSION [0-9.]+" CMakeLists.txt | awk '{print $3}')
          NUC=$(grep -oE 'ESCOITA_NUCLEO_VERSION "[^"]+"' CMakeLists.txt | cut -d'"' -f2)
          { echo "NOME=$NOME"; echo "CURTO=$CURTO"; echo "AU=$AU"; echo "VER=$VER"; echo "NUCLEO=$RUNNER_TEMP/escoita-nucleo"; } >> "$GITHUB_ENV"
          git clone -q --depth 1 --branch "${{ inputs.juce }}" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          git clone -q --depth 1 --branch "$NUC" https://github.com/callejodev-dotcom/escoita-nucleo.git "$RUNNER_TEMP/escoita-nucleo"
      - name: Compilar (universal)
        run: |
          set -o pipefail
          ( cmake -B build -G Xcode -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DESCOITA_NUCLEO="$NUCLEO" -DBARULLO_TESTS=ON -DBARULLO_WERROR=ON \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" && cmake --build build --config Release -j 4 ) 2>&1 | tee build.log \
            || { grep -E "error:|CMake Error" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Probas do plugin
        run: if [ -f tools/probas-ci.sh ]; then bash tools/probas-ci.sh mac; else echo "(sen tools/probas-ci.sh)"; fi
      - name: pluginval (VST3, nivel 10)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests \
            "build/${CURTO}_artefacts/Release/VST3/$NOME.vst3"
      - name: Certificado de Apple (só se está configurado)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/firma.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KC"
      - name: Empaquetar (.pkg e .zip)
        run: bash "$NUCLEO/empaquetado/mac.sh" packaging/produto.env "build/${CURTO}_artefacts/Release" "$VER" dist
      - name: Validar o AU (auval)
        if: env.AU != ''
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/${CURTO}_artefacts/Release/AU/$NOME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v $AU
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Datos do produto, JUCE e núcleo
        run: |
          source packaging/produto.env
          VER=$(grep -oE "project\($CURTO VERSION [0-9.]+" CMakeLists.txt | awk '{print $3}')
          NUC=$(grep -oE 'ESCOITA_NUCLEO_VERSION "[^"]+"' CMakeLists.txt | cut -d'"' -f2)
          T="$(cygpath -m "$RUNNER_TEMP")"
          { echo "NOME=$NOME"; echo "CURTO=$CURTO"; echo "WINDOWS_APPID=$WINDOWS_APPID"; echo "VER=$VER"; echo "JUCE=$T/JUCE"; echo "NUCLEO=$T/escoita-nucleo"; } >> "$GITHUB_ENV"
          git clone -q --depth 1 --branch "${{ inputs.juce }}" https://github.com/juce-framework/JUCE.git "$T/JUCE"
          git clone -q --depth 1 --branch "$NUC" https://github.com/callejodev-dotcom/escoita-nucleo.git "$T/escoita-nucleo"
      - name: Compilar
        run: |
          set -o pipefail
          ( cmake -B build -A x64 -DJUCE_DIR="$JUCE" -DESCOITA_NUCLEO="$NUCLEO" -DBARULLO_TESTS=ON && cmake --build build --config Release -j 4 ) 2>&1 | tee build.log \
            || { grep -E "error|Error|CMake Error" build.log | grep -v "error.h\|-Werror\|onerror" | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Probas do plugin
        run: if [ -f tools/probas-ci.sh ]; then bash tools/probas-ci.sh windows; else echo "(sen tools/probas-ci.sh)"; fi
      - name: pluginval (VST3, nivel 10)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pv.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests \
            "build/${CURTO}_artefacts/Release/VST3/$NOME.vst3"
      - name: Instalador (Inno Setup, en galego)
        run: |
          choco upgrade innosetup -y --no-progress   # o galego precisa a 6.5 ou posterior
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          ART="$(cygpath -w "$PWD/build/${CURTO}_artefacts/Release")"
          OUT="$(cygpath -w "$PWD/dist")"
          "$ISCC" "//DNome=$NOME" "//DCurto=$CURTO" "//DAppId=$WINDOWS_APPID" "//DAppVersion=$VER" "//DArtDir=$ART" "//DOutDir=$OUT" \
            "$(cygpath -w "$NUCLEO/empaquetado/windows.iss")"
      - name: Zip portátil
        run: |
          A="build/${CURTO}_artefacts/Release"
          D="$CURTO-$VER-windows-x64"
          mkdir -p "$D"
          cp -R "$A/VST3/$NOME.vst3" "$D/"
          cp "$A/Standalone/$NOME.exe" "$D/"
          if [ -e "$A/CLAP/$NOME.clap" ]; then cp "$A/CLAP/$NOME.clap" "$D/"; fi
          if [ -f packaging/LEEME-windows.txt ]; then cp packaging/LEEME-windows.txt "$D/LEEME.txt"; fi
          7z a -tzip "dist/$D.zip" "$D" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04   # glibc antiga: así funciona tamén en distribucións de hai uns anos
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libfreetype6-dev libfontconfig1-dev ninja-build xvfb
      - name: Datos do produto, JUCE e núcleo
        run: |
          source packaging/produto.env
          VER=$(grep -oE "project\($CURTO VERSION [0-9.]+" CMakeLists.txt | awk '{print $3}')
          NUC=$(grep -oE 'ESCOITA_NUCLEO_VERSION "[^"]+"' CMakeLists.txt | cut -d'"' -f2)
          { echo "NOME=$NOME"; echo "CURTO=$CURTO"; echo "VER=$VER"; echo "NUCLEO=$RUNNER_TEMP/escoita-nucleo"; } >> "$GITHUB_ENV"
          git clone -q --depth 1 --branch "${{ inputs.juce }}" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          git clone -q --depth 1 --branch "$NUC" https://github.com/callejodev-dotcom/escoita-nucleo.git "$RUNNER_TEMP/escoita-nucleo"
      - name: Compilar
        run: |
          set -o pipefail
          ( cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DESCOITA_NUCLEO="$NUCLEO" -DBARULLO_TESTS=ON \
              && cmake --build build ) 2>&1 | tee build.log \
            || { grep -E "error:|CMake Error" build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Probas do plugin
        run: if [ -f tools/probas-ci.sh ]; then bash tools/probas-ci.sh linux; else echo "(sen tools/probas-ci.sh)"; fi
      - name: pluginval (VST3, nivel 10, con interface)
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            "build/${CURTO}_artefacts/Release/VST3/$NOME.vst3"
      - name: clap-validator (se hai CLAP)
        run: |
          C="build/${CURTO}_artefacts/Release/CLAP/$NOME.clap"
          if [ ! -e "$C" ]; then echo "(sen CLAP)"; exit 0; fi
          curl -sSL -o cv.zip https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
          unzip -q cv.zip -d cv && (cd cv && for t in *.tar.gz; do [ -e "$t" ] && tar xzf "$t"; done; true)
          CV=$(find cv -name clap-validator -type f | head -1); chmod +x "$CV"
          "$CV" validate "$C"
      - name: Empaquetar (.tar.gz)
        run: bash "$NUCLEO/empaquetado/linux.sh" packaging/produto.env "build/${CURTO}_artefacts/Release" "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  sanitizadores:
    name: Memoria e comportamento indefinido (ASan + UBSan)
    if: inputs.sanitizadores != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libfreetype6-dev libfontconfig1-dev ninja-build
      - name: JUCE e núcleo
        run: |
          NUC=$(grep -oE 'ESCOITA_NUCLEO_VERSION "[^"]+"' CMakeLists.txt | cut -d'"' -f2)
          git clone -q --depth 1 --branch "${{ inputs.juce }}" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          git clone -q --depth 1 --branch "$NUC" https://github.com/callejodev-dotcom/escoita-nucleo.git "$RUNNER_TEMP/escoita-nucleo"
      - name: Compilar as probas con sanitizadores
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DESCOITA_NUCLEO="$RUNNER_TEMP/escoita-nucleo" \
            -DBARULLO_TESTS=ON -DBARULLO_SANITIZE=ON
          cmake --build build --target ${{ inputs.sanitizadores }}
      - name: Probas con sanitizadores
        run: bash tools/probas-ci.sh sanitizadores

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled()
    needs: [mac, windows, linux, sanitizadores]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome do produto
        run: source packaging/produto.env && echo "NOME=$NOME" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.NOME }} ${{ github.ref_name }}
          body_path: packaging/NOTAS-VERSION.md
          files: dist/*
